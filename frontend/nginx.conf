server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # The API on the same address as the app, so a server needs only one domain (VITE_API_BASE_URL=/api/v1).
  # The name is looked up per request through Docker's DNS, so nginx starts even before the backend is up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 30m;         # file uploads (MAX_UPLOAD_MB)
  location ~ ^/(api/|health$) {
    set $backend http://innovatex-backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Single-page app: every unknown path falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
